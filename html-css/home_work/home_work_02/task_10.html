<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 10</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .wrapper {
           margin: 0 auto;
            width: 500px;
            background-color: rgb(218, 211, 211)
        }

        li a {
            display: block;
            text-decoration: none;
        }

        .list {
            list-style: none;
            border: 1px solid black;
            
        }

        .item {
            padding: 10px;
            border-bottom: 1px solid black; 
        }

        .item:hover {
            background-color: green;
        }

        .item:active {
            background-color: rgb(10, 109, 10);
        }

        .item:focus {
            background-color: rgb(6, 73, 6);
        }

        li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <ul class="list">
                <li class="item active"><a href="#">Пункт 1</a></li>
                <li class="item active"><a href="#">Пункт 2</a></li>
                <li class="item active"><a href="#">Пункт 3</a></li>
                <li class="item active"><a href="#">Пункт 4</a></li>
                <li class="item active"><a href="#">Пункт 5</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
