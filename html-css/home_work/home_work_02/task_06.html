<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: fit-content;
            margin: 0 auto;
        }

        .sm {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            transition: background-color 1.3s; 
        }
        .img {
            transition: transform 1.3s;
        }
        .sm:hover .img {
            transform: scale(1.3);
        }
        .facebook {
            background-color: blue;
        }
        .facebook:hover {
            background-color: rgb(51, 51, 232);
        }

        .instagram {
            background-color: palevioletred;
        }

        .instagram:hover {
           background-color: rgb(207, 122, 153);
        }

        .twitter {
            background-color: aqua;
        }

         .twitter:hover {
            background-color: rgb(123, 235, 235);
        }

        .youtube {
            background-color: red;
        }

         .youtube:hover {
            background-color: rgb(245, 105, 105);
        }
        
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <a href="#" class="sm facebook"><img class="img" src="./images/facebook.png" alt="" width="36"></a>
            <a href="#" class="sm instagram"><img class="img" src="./images/instagram.png" alt="" width="36"></a>
            <a href="#" class="sm twitter"><img class="img" src="./images/twitter.png" alt="" width="36"></a>
            <a href="#" class="sm youtube"><img class="img" src="./images/-youtube.png" alt="" width="36"></a>
        </div>
    </div>
    </div>
</body>

</html>
