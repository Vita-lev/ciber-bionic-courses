<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <style>
        body {
            box-sizing: border-box;
            background-color: rgb(219, 216, 216);
        }

        .wrapper {
            text-transform: uppercase;
        }

        .container {
            margin: 0 auto;
            background-color: white;
            width: 500px;
            padding: 5px;
        }

        .green {
            background-color: rgb(49, 145, 22);
            color: white;
        }

        .blue {
            background-color: rgb(71, 205, 225);
        }

        .yellow {
            background-color: rgb(224, 224, 21);
            color: red;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <p>html</p>
            <p class="green">90%</p>
            <p>css</p>
            <p class="blue">70%</p>
            <p>js</p>
            <p class="yellow">20%</p>

        </div>
    </div>
</body>

</html>
