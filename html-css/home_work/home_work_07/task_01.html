<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 01</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(197, 199, 199);
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            max-width: 100%;
            color: gray;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;

            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 250px;
            background-color: rgb(255, 255, 255);
        }

        .form {
        width: 100%;
        max-width: 500px;
        }

        .fieldset {
        border: none;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        gap: 10px;
        }

        .legend {
            font-style: italic;
            margin-bottom: 10px;
        }

        .btn {
        padding: 15px 35px;
        background-color: rgb(91, 181, 150);
        color: white;
        cursor: pointer;
        border: none;
        font-size: 17px;
        
        }

        .btn:hover {
        background-color: rgb(86, 148, 126);
        color: white;
        }

        .btn:active {
        background-color: rgb(24, 103, 49);
        color: white;
        }

        .input {
        width: 100%;
        padding: 15px;
        font-size: 16px;
       
        /* border: 1px solid transparent; */
        border: 1px solid rgb(197, 192, 192);
        color: rgb(191, 190, 190);
        }
/* .input:invalid {
    border: 2px solid tomato;
} */
        .legend {
        text-align: center;
        font-size: 20px;
        padding-bottom: 20px;
        }

        @media (max-width:600px){
            .fieldset {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                width: 100%;
            }
        }
        .input::placeholder {
            color: rgb(191, 190, 190);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <form class="form" action="#" method="post" name="form01" enctype="form01" id="form01">
                  <fieldset class="fieldset"><legend class="legend">Stay of the saddle!</legend>
                <input class="input" type="mail" id="mail" name="Email" placeholder="enter your email..." required>
            <button type="submit" class="btn" >GO</button>
            </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
