<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(197, 199, 199);
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            max-width: 100%;
            color: rgb(35, 12, 12);
        }

        .container {
            width: 90%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            height: auto;
            background-color: bisque;

            padding: 20px;
        }

        .form {
            width: 90%;
            max-width: 600px;
        }

        .title {
            text-align: center;
             margin-bottom: 10px;
             
        
        }

        .fieldset {
        border: none;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        gap: 10px;
        font-size: 12px;
        /* margin-top: 25px; */
        }

        .btn {
        padding: 12px 20px;
        background-color: rgb(251, 25, 0);
        color: white;
        cursor: pointer;
        border: none;
        text-transform: uppercase;
        border-radius: 3px;
        font-size: 10px;
        white-space: nowrap;
        }

        .btn:hover {
        background-color: rgb(144, 8, 28);
        color: white;
        }

        .btn:active {
        background-color: rgb(97, 3, 23);
        color: rgb(249, 11, 11);
        }

        .input {

            width: 50%;
        padding: 11px;
        font-size: 10px;
       
       border-radius: 3px;
        border: 1px solid transparent;
        }
/* .input:invalid {
    border: 2px solid tomato;
} */
        .legend {
        text-align: center;
        margin-bottom: 30px;
        
        
        }

        @media (max-width: 600px){
            /* .wrapper {
                padding: 20px;
            } */
            .fieldset {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }
            .title {
                font-size: 22px;
            }

            .legend {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .input {
             width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <form class="form" action="#" method="post" name="form01" enctype="form01" id="form01">
                <h2 class="title">Some form title text</h2>
                  <fieldset class="fieldset">
                    <legend class="legend">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ipsam, eius!</legend>
                <input class="input" type="mail" id="mail" name="mail" placeholder="Email Adress..." required>
            <button type="submit" class="btn" for="mail">subscribe</button>
            </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
