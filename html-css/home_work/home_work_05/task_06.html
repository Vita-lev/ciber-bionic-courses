<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 06</title>
    <style>
        * {
            padding: 0;
            margin: 0;  
            box-sizing: border-box;
        }
        .wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            max-width: 1200px;
            height: 100vh;
            background-color: antiquewhite;
            width: 100%;
            margin: 0 auto;
        }
        .container {
            width: 90%;
            background-color: white;
        }
        .group {
            margin: 10px;
            padding: 20px;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
        }
        .group--html {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 50px;
            width: 500px;
            height: 400px;
          font-size: 42px; 
          padding: 20px;
            background-size: cover;
            background-position: center;
            border: 2px solid gray;
            border-radius: 30px ;
            margin: 20px;
        }
        .html--text {
            text-align: center;
            padding: 0 20px;
        }
        .html--img {
             background-image: url(./images/HTML5.png);
             background-size: cover;
             width: 150px;
             height: 150px;
        }
        .group--css {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 500px;
            height: 400px;
            border: 2px solid gray;
            border-radius: 30px ;
            margin: 20px;
            gap: 50px;
           font-size: 42px;
           padding: 20px;
        }

        .css--img {
            background-image: url(./images/CSS3.png);
             background-size: cover;
             background-position: center;
             width: 150px;
             height: 150px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="group">
                <div class="group--html">
                    <div class="html--img"></div>
                    <div class="html--text">HyperText Markup Language</div>
                </div>
                <div class="group--css">
                    <div class="css--img"></div>
                    <div class="html--text">Cascading Style Sheets</div>
                </div>
                
            </div>
        </div>
    </div>
    
</body>
</html>
