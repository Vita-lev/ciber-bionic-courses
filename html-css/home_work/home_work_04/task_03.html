<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 03</title>
    <style>
        a {
            text-decoration: none;
            color: white;
        }
        .menu {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            background-color: black;
        }
        .item {
           padding: 41px;
            color: white;
            transition: 1s;
        }
        .item:hover {
            background-color: DimGray;
        }
        .item:active {
            background-color: DimGray;
            color: rgb(0, 0, 0);
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="menu">
       <a class="item" href="#">Инвесторам</a>
       <a class="item" href="#">Реклама</a>
       <a class="item" href="#">Вакансии</a>
    </div>
</div>
</body>
</html>
