<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 03</title>
    <style>
        .container {
            background-color: rgb(255, 217, 0);
            padding: 5px;
        }

        .list {
            list-style: none; 
        }

        .menu--list {
            padding: 10px;
            margin: 20px;
            width: fit-content;
            border: 1px solid black;
            display: inline-block;
            transition: 0.5s;
        }

        .menu--list:hover {
            transform: scale(1.3);
        }

        .facebook {
            background-color: blue;
        }

        .facebook:hover {
            background-color: rgb(91, 91, 250);
        }

        .youtube {
            background-color: red;
        }

        .youtube:hover {
            background-color: rgb(231, 87, 87);
        }

        .instagram {
            background-color: palevioletred;
        }

        .instagram:hover {
            background-color: rgb(220, 138, 165);
        }

        .twitter {
            background-color: aqua;
        }

        .twitter:hover {
            background-color: rgb(128, 237, 237);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="menu">
                <ul class="list">
                    <li class="menu--list facebook"><a class="menu--item" href="#"><img src="/images/facebook.png" alt="facebook"></a></li>
                    <li class="menu--list youtube"><a class="menu--item" href="#"><img src="/images/-youtube.png" alt="facebook"></a></li>
                    <li class="menu--list instagram"><a class="menu--item" href="#"><img src="/images/instagram.png" alt="facebook"></a></li>
                    <li class="menu--list twitter"><a class="menu--item" href="#"><img src="/images/twitter.png" alt="facebook"></a></li>
                </ul>
            </div>
        </div>
    </div>
    
</body>
</html>
