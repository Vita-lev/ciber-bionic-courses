<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        .box {
            margin: 0 auto;
            width: 800px;
            height: 200px;
            border: 5px solid black;
            text-align: right;
            padding: 36px;
        }

        .text {
            width: 500px;
            display: inline-block;
            background-color: gray;
            text-align: start;
            padding: 20px;
            font-size: 24px;
        } 
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="box">
              <p class="text">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Aut harum eaque accusamus nostrum porro eos?</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
