<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }

      /* .switch input {
        display: none;
      } */

      .slider {
        position: absolute;
        inset: 0;
        background: #ccc;
        border-radius: 34px;
        cursor: pointer;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 26px;
        height: 26px;
        left: 4px;
        top: 4px;
        background: white;
        border-radius: 50%;
        transition: 0.3s;
      }

      input:checked + .slider {
        background: #4caf50;
      }

      input:checked + .slider::before {
        transform: translateX(26px);
      }
    </style>
  </head>
  <body>
    <label class="switch">
      <input type="checkbox" />
      <span class="slider"></span>
    </label>
  </body>
</html>
