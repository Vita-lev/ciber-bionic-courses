<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            font-size: 100px;
        }

        .wrapper{
           padding: 19px 17px;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
           background-color: grey;
        }

        .container {
            background-color: aliceblue;
            width: 2000px;
            height: 1500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .list {
list-style: none;

        }
        .list__item::before {
            content: '';
            width: 100px;
            height: 100px;

            display: inline-block;
            background-image: url(./image/1.png);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            vertical-align: middle;

            margin-right: 50px;

          

            
        }
      
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <ul class="list">
                <li class="list__item">Lorem ipsum dolor sit amet.</li>
                <li class="list__item">Lorem ipsum dolor sit amet.</li>

                <li class="list__item">Lorem ipsum dolor sit amet.</li>
                <li class="list__item">Lorem ipsum dolor sit amet.</li>
            </ul>
        </div>
    </div>
    
</body>
</html>
