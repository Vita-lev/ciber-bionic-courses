<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 01</title>
    <style>
      .switch {
        position: relative;
        display: inline-block;
        width: 100px;
        height: 50px;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: gray;
        border-radius: 35px;
        cursor: pointer;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 30px;
        height: 30px;
        left: 10px;
        top: 10px;
        background-color: blue;
        border-radius: 50%;
        transition: 0.5s;
      }

      .input:checked + .slider {
        background-color: aquamarine;
      }

      .input:checked + .slider::before {
        transform: translateX(50px);
      }

      .input {
        display: none;
      }
    </style>
  </head>
  <body>
    <label class="switch">
      <input class="input" type="checkbox" />
      <span class="slider"></span>
    </label>
  </body>
</html>
