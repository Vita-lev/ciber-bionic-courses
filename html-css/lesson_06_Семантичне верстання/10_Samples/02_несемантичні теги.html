<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: aqua;
        }
        @media (max-width:600px) {
            body {
                background-color: blue;
            }


        }

        .box {
            width: 400px;
            height: 400px;
            background-color: rgb(153, 153, 69);
        }

        @media (max-width:600px) {
            .box {
                width: 200px;
            height: 600px;
            background-color: rgb(140, 26, 140);
            }


        }

@media (min-width:600px) and (max-width:1000px) {
    body {
        background-color: rgb(140, 26, 140);
    }

    .box {
        display: none;
    }
    
}

        @media(min-width: 1000px) {
            body {
                background-color: gray;
            }

            .box {
                width: 100px;
            height: 200px;
            background-color: rgb(140, 26, 60);
            border: 3px solid black;
        }
    
    
    }

    /* @media(orientation:landscape){
        .box {
            background-color: aqua;
        }
        
    } */
    
      @media (max-aspect-ratio:1/1)  {
        .box {
            background-color: rgb(0, 0, 0);
        }
      }
    @media  {
        
    }
    </style>
</head>
<body>

    <div class="box">

    </div>
    @media
    <!-- 
        Теги без смислового навантаження та максимум мають візуальне відображення
     -->
    <div>div</div>
    <span>span</span>
    <i>i</i>
    <b>b</b>
    <strong>bbbbbiiiiiivvvvvvi</strong>
    <em>iiiiibbbbbggggg</em>
</body>
</html>
