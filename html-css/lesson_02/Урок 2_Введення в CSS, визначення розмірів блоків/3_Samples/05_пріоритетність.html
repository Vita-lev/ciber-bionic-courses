<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пріоритетність у CSS</title>
    <!-- https://w3schoolsua.github.io/css/css_specificity.html#gsc.tab=0 -->
</head>
<body>
    <style>
        /*Ідентифікатор: висока пріоритетність = 100*/
        #alert{
            background: green;
            background: aqua;
            border: 2px solid red;
        }
        /*Клас: середня пріоритетність = 10*/
        .paragraph{
            background: blue;
        }
        /*Ім'я теґу: низька пріоритетність = 1*/
        p{
            background: gold;
            font-size: 40px;
        }
    </style>
    <!-- Атрибут style пріоритетність = 1000 -->
    <p class="paragraph" id="alert" >Lorem ipsum dolor sit amet.</p>
<p class="paragraph"  >Lorem ipsum dolor sit amet.</p> 


<p   >Lorem ipsum dolor sit amet.</p> 
<p   >Lorem ipsum dolor sit amet.</p> 
<p   >Lorem ipsum dolor sit amet.</p> 

</body>
</html>
