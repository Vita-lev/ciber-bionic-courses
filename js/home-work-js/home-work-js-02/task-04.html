<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Завдання 4</title>
  </head>
  <body>
    <script>
      let a = 10;

      let b = 20;

      document.body.innerHTML = `
      let a = 10;
        <br>
      let b = 20;
        <br>
      Оператори порівняння: <br>
        a > b = ${a > b}; a більше b<br>
        a < b = ${a < b}; a менше b<br>
        a >= b = ${a >= b}; a більше або дорівнює b<br>
        a <= b = ${a <= b}; a менше або дорівнює b<br>
        a == b = ${a == b}; a дорівнює b<br>
        `;
    </script>
  </body>
</html>
