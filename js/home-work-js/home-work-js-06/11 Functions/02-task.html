  <body>
    <pre>
        Завдання:
        Створіть функцію avg(a, b, c), яка повертає
         середнє арифметичне для чисел a, b, c
        Якщо параметр відсутній, не використовуйте 
        значення для розрахунку середнього 
        арифметичного значення.
    </pre>
    <script>
      function avg(a, b, c) {
        let sum = 0;
        let count = 0;

        if (a !== undefined) {
          sum += a;
          count++;
        }

        if (c !== undefined) {
          sum += b;
          count++;
        }

        if (c !== undefined) {
          sum += c;
          count++;
        }

        return sum / count;
      }

      console.log(avg(10, 20, 30));
      console.log(avg(10, 20));
      console.log(avg(10));
    </script>
  </body>
