  <body>
    <pre>
        Завдання:
        Створіть функцію, яка приймає масив значень та повертає масив з значеннями, що дублюються, або null якщо
        повторюваних значень у масиві немає.
    </pre>
    <script>
      function getDuplicates(arr) {
        let duplicates = [];

        for (let i = 0; i < arr.length; i++) {
          if (arr.indexOf(arr[i]) !== i && !duplicates.includes(arr[i])) {
            duplicates.push(arr[i]);
          }
        }

        return duplicates.length > 0 ? duplicates : null;
      }

      console.log(getDuplicates([1, 2, 3, 2, 4, 5, 1]));
      // [2, 1]

      console.log(getDuplicates([1, 2, 3, 4, 5]));
      // null
    </script>
  </body>
