<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 02</title>
  </head>
  <body>
    <h1>Об'єкти. Завдання 2</h1>
    <p>
      У сценарії за допомогою літералу створіть об'єкт із двома властивостями
      firstName та age. Додайте в цей об'єкт метод sayHello, який виведе на екра
      повідомлення "Привіт, мене звуть X, мені Y років.". Використовуючи
      значення властивостей замість X та Y.
    </p>

    <script>
      let user = {
        firstName: "Віта",
        age: 35,

        sayHello: function () {
          console.log(
            "Привіт, мене звуть " +
              this.firstName +
              ", мені " +
              this.age +
              " років.",
          );
        },
      };

      user.sayHello();
    </script>
  </body>
