<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1</title>
  </head>
  <body>
    <pre>
        Завдання:
        Змініть if...else на switch
    </pre>
    <script>
      let value = Number(prompt("Введіть число 1 або 2"));

      switch (value) {
        case 1:
          alert("Ви ввели число 1");
          break;

        case 2:
          alert("Ви ввели число 2");
          break;

        default:
          alert("Ви ввели неправильне значення");
      }
    </script>
  </body>
</html>
