  <body>
    <pre>
        Завдання:
        Створіть функцію min(a, b), яка повертає менше з числа а та b
    </pre>
    <script>
      function min(a, b) {
        if (a < b) {
          return a;
        }
        return b;
      }

      console.log(min(5, 10));
      console.log(min(8, 3));
    </script>
  </body>
