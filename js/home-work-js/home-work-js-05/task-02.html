  <body>
    <h1>Завдання 2</h1>
    <p>
      Створіть функцію, яка приймає два параметри та повертає суму значень цих
      параметрів. Викличте функцію з двома довільними значеннями та відобразіть
      результат роботи функції на екрані.
    </p>

    <script>
      function sum(a, b) {
        return a + b;
      }

      let result = sum(5, 10);
      alert(result);
    </script>
