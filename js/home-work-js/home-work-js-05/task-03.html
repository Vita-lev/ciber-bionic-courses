  <body>
    <h1>Завдання 3</h1>
    <p>
      Створіть одну глобальну змінну з довільним значенням та дві функції.
      Покажіть, що глобальна змінна може використовуватися в цих двох функціях.
    </p>

    <script>
      let message = "Привіт, я глобальна змінна";

      function showFirst() {
        alert(message);
      }

      function showSecond() {
        console.log(message);
      }

      showFirst();
      showSecond();
    </script>
  </body>
