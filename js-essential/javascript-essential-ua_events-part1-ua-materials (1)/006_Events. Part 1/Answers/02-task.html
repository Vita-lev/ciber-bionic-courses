<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
</head>

<body>
    Радіус <input id="radiusInput" type="text"> <br />
    Висота <input id="heightInput" type="text"> <br />

    <button id="calcButton">Розрахунок об'єму</button>

    <div id="output"></div>
    
    <script>
        /*
        Завдання:
        Напишіть сценарій, який обчислює об'єм циліндра по параметрам, які вводить користувач.
        Для розрахунку використовуйте формулу - V=π * r у квадраті * h.
        Розмістіть на сторінці два поля для вводу: перше - для радіуса циліндра, друге - для висоти циліндра.
        Об'єм циліндра виведіть у тіло сторінки.
        */
        let btn = document.querySelector("#calcButton");
        let radiusInput = document.querySelector("#radiusInput");
        let heigthInput = document.querySelector("#heightInput");

        btn.addEventListener("click", function() {
            let height = heightInput.value;
            let radius = radiusInput.value;
            let volume = Math.PI * Math.pow(radius, 2) * height;

            document.querySelector("#output").textContent = volume;
        });
    </script>
</body>

</html>
