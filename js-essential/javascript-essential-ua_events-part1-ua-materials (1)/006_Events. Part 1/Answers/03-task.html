<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 03</title>

    <style>
        .error {
            color: red;
            display: none;
        }

        .error-border {
            border: 1px solid red;
        }
    </style>
</head>

<body>
    Операнд 1: <input id="input1" type="text"> <br />
    <span id="input1Error" class="error">Введіть значення</span> <br />

    Операнд 2: <input id="input2" type="text"> <br />
    <span id="input2Error" class="error">Введіть значення</span> <br />

    <button id="add-btn">+</button>
    <button id="rem-btn">-</button>
    <button id="mul-btn">*</button>
    <button id="div-btn">/</button>
    <button id="reset-btn">reset</button>

    <script>
        /*
        Завдання:
        Внесіть зміни до цього сценарію.
        Додайте обробник на клік по кнопці reset. При натисканні на значення, введені в поля для вводу "Операнд 1"
        та "Операнд 2", повинні бути замінені на значення 0.
        Додайте перевірку перед виконанням будь-якої арифметичної операції. Якщо поле для вводу порожнє, зробіть
        для цього поля червону рамку і видимий елемент з помилкою під цим полем введення.
        Для поля вводу input1 за відсутності значення, зробіть видимим span #input1Error, для поля вводу
        input2 зробіть, якщо помилка, #input2Error видимим.
        */
        let input1 = document.querySelector("#input1");
        let input2 = document.querySelector("#input2");

        let addBtn = document.querySelector("#add-btn");
        let remBtn = document.querySelector("#rem-btn");
        let mulBtn = document.querySelector("#mul-btn");
        let divBtn = document.querySelector("#div-btn");
        let resetBtn = document.querySelector("#reset-btn");

        addBtn.addEventListener("click", function () {
            resetErrors();

            if (validate()) {
                alert(Number(input1.value) + Number(input2.value));
            }
        });

        remBtn.addEventListener("click", function () {
            resetErrors();
            
            if (validate()) {
                alert(input1.value - input2.value);
            }
        });

        mulBtn.addEventListener("click", function () {
            resetErrors();

            if (validate()) {
                alert(input1.value * input2.value);
            }
        });

        divBtn.addEventListener("click", function () {
            resetErrors();

            if (validate()) {
                alert(input1.value / input2.value);
            }
        });

        // скидання значень у полях для вводу
        resetBtn.addEventListener("click", function () {
            input1.value = input2.value = 0;
        });

        // функція перевірки, якщо хоча б одне з полів введення без значення, повертає false
        function validate() {
            let valid = true;

            if (!input1.value) {
                showError(input1);
                valid = false;
            }

            if (!input2.value) {
                showError(input2);
                valid = false;
            }

            return valid;
        }

        // функція для відображення червоної рамки для поля вводу та відображення повідомлення про помилку
        function showError(element) {
            element.classList.add("error-border");
            let errorSpanId = element.id + "Error"; //input1Error или input2Error
            document.querySelector("#" + errorSpanId).style.display = "block";
        }

        // функція для приховання всіх помилок та видалення стилів пов'язаних з помилками
        function resetErrors() {
            let errorsSpans = document.querySelectorAll(".error");
            errorsSpans.forEach(span => {
                span.style.display = "none";
            });

            let inputs = document.querySelectorAll("input");
            inputs.forEach(input => {
                input.classList.remove("error-border");
            });
        }
    </script>
</body>

</html>
