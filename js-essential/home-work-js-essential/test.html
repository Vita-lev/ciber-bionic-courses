  <head>

    <title>Test</title>
  </head>
  <body>
    <button id="btn">play</button>
    <button id="btn2">2+2=?</button>
    <button id="btn3">login</button>

    <script>
      let btn = document.querySelector("#btn");
      let btn2 = document.querySelector("#btn2");
      let btn3 = document.querySelector("#btn3");

      btn.addEventListener("click", function () {
        console.log("play");
      });

      btn2.addEventListener("click", function () {
        console.log("2+2=" + (2 + 2));
      });

      btn3.addEventListener("click", login);

      function login() {
        console.log("Hai Vita");
      }

      function two(num) {
        console.log(num);
      }

      two(4);

      function name(text) {
        console.log("hello " + text + "!");
      }

      name("Vita");
      name("Sasha");

      //   name("text");
    </script>
  </body>
</html>
