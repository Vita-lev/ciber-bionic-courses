<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .out {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      li {
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="out"></div>

    <script>
      const cities = [
        {
          name: "Київ",
          id: 703448,
          lang: "ua",
        },
        {
          name: "Лондон",
          id: 2643743,
          lang: "en",
        },
        {
          name: "Нью-Йорк",
          id: 5128638,
          lang: "en",
        },
      ];
      function showWheather(cities) {
        fetch(
          `https://api.openweathermap.org/data/2.5/weather?id=${cities.id}&appid=bf35cac91880cb98375230fb443a116f&units=metric&lang=${cities.lang}`,
        )
          .then((response) => response.json())
          .then((data) => {
            console.log(data);
            let out = document.querySelector(".out");

            out.innerHTML += `
                <div class="item">
                <h2>Місто: ${data.name}</h2>
                <ul>
                  <li>Погода: ${data.weather[0].description} <img src="http://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" width="30"> </li>
                  <li>Температура: ${Math.floor(data.main.temp)}°C</li>
                  </ul>
                </div>
          `;
          })
          .catch((error) => {
            console.log(error);
          });
      }

      cities.map((item) => showWheather(item));
    </script>
  </body>
</html>
