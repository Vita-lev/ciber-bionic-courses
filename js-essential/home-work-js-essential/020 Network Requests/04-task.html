<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 04</title>
  </head>

  <body>
    <script>
      let url = "https://jsonplaceholder.typicode.com/todos";
      fetch(url)
        .then((response) => response.json())
        .then((todos) => {
          let table = document.createElement("table");
          table.border = "2";

          let headerRow = document.createElement("tr");
          headerRow.innerHTML =
            "<th>ID</th><th>User ID</th><th>Title</th><th>Completed</th>";
          table.appendChild(headerRow);

          todos.forEach((todo) => {
            let row = document.createElement("tr");
            row.innerHTML = `
            <td>${todo.id}</td>
            <td>${todo.userId}</td>
            <td>${todo.title}</td>
            <td>${todo.completed}</td>
            `;

            table.appendChild(row);
          });

          document.body.appendChild(table);
        })
        .catch((error) => console.log("Помилка:", error));

      /*
        Завдання:
        Напишіть сценарій, який виконує запит GET 
        за адресою https://jsonplaceholder.typicode.com/todos
        і виводить вміст відповіді у вигляді
        таблиці.
        */
    </script>
  </body>
</html>
