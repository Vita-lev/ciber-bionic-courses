<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      table,
      th,
      td {
        border: 1px solid black;
      }

      td,
      th {
        padding: 8px;
      }
    </style>
  </head>

  <body>
    <script>
      /*
      Завдання:
      Створіть таблицю (table, tr, td) на основі масиву об'єктів з ім'ям source. Кожен об'єкт – окремий рядок таблиці. Властивість month – значення для першої колонки.
      Властивість amont – значення для другої колонки.
      */

      let table = document.createElement("table");

      let source = [
        {
          month: "Січень",
          amount: 20,
        },
        {
          month: "Лютий",
          amount: 140,
        },
        {
          month: "Березень",
          amount: 115,
        },
        {
          month: "Квітень",
          amount: 100,
        },
        {
          month: "Травень",
          amount: 80,
        },
        {
          month: "Червень",
          amount: 90,
        },
        {
          month: "Липень",
          amount: 100,
        },
      ];

      for (const item of source) {
        let tr = document.createElement("tr");

        let tdMonth = document.createElement("td");
        tdMonth.textContent = item.month;

        let tdAmount = document.createElement("td");
        tdAmount.textContent = item.amount;

        tr.append(tdMonth);
        tr.append(tdAmount);

        table.append(tr);
      }

      document.body.append(table);
    </script>
  </body>
</html>
