<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 01</title>

    <style>
      #container {
        position: relative;
        border: 1px solid gray;
        width: 265px;
        height: 50px;
        margin-top: 20px;
      }

      #element {
        width: 50px;
        height: 50px;
        background-color: green;
        position: absolute;
        left: 0;
        top: 0;
      }
    </style>
  </head>

  <body>
    <button id="startBtn">Старт</button>
    <button id="stopBtn">Стоп</button>
    <button id="increaseBtn">Прискорити</button>
    <button id="decreaseBtn">Уповільнити</button>

    <div id="container">
      <div id="element"></div>
    </div>

    <script>
      /*
        Завдання:
        
        Доопрацюйте сценарій.
        1. Під час натискання на кнопку "Стоп" анімація має зупинитися.
        2. Під час натискання на кнопку "Прискорити" анімація має 
        прискоритися. За повторного натискання швидкість анімації
           має збільшуватися.
        3. Під час натискання на кнопку "Уповільнити" анімація
        сповільнюється. За повторного натискання швидкість стає
           меншою.
        */

      let element = document.querySelector("#element");
      let elementWidth = parseInt(getComputedStyle(element).width);
      let containerWidth = parseInt(
        getComputedStyle(document.querySelector("#container")).width,
      );
      let startBtn = document.querySelector("#startBtn");
      let stopBtn = document.querySelector("#stopBtn");
      let increaseBtn = document.querySelector("#increaseBtn");
      let toggle = 0;
      let speed = 40;
      let direction = "right";

      function moveLeft(num) {
        element.style.left = getLeft(element) - num + "px";
      }

      function moveRight(num) {
        element.style.left = getLeft(element) + num + "px";
      }

      function getLeft(e) {
        return parseInt(getComputedStyle(e).left);
      }

      function move(a) {
        if (getLeft(element) >= containerWidth - elementWidth) {
          direction = "left";
        }
        if (getLeft(element) <= 0) {
          direction = "right";
        }

        if (direction == "right") {
          moveRight(a);
        } else {
          moveLeft(a);
        }
      }

      startBtn.addEventListener("click", () => {
        stopStart(40);
      });

      function stopStart(num) {
        if (toggle === 0) {
          toggle = 1;

          const intervalId = setInterval(() => move(3), num);

          stopBtn.addEventListener("click", () => {
            toggle = 0;
            clearInterval(intervalId);
          });
        }
      }
    </script>
  </body>
</html>
