<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 02</title>
  </head>

  <body>
    <input id="radius" type="text" />
    <input id="height" type="text" />

    <button id="btn">Розрахувати</button>
    <p id="sumVolume"></p>
    <script>
      //   let radius = document.querySelector("#radius");

      let btn = document.querySelector("#btn");

      btn.addEventListener("click", function () {
        let radius = Number(document.querySelector("#radius").value);
        let height = Number(document.querySelector("#height").value);

        let volume = Math.PI * radius * radius * height;

        let sumVolume = document.querySelector("#sumVolume");

        sumVolume.innerHTML = volume;
      });

      /*
        Завдання:
        Напишіть сценарій, який вираховує об'єм циліндра за параметрами,
        які користувач вводить.
        Для розрахунку використовуйте формулу V = π * r у квадраті * h.
        Розмістіть на сторінці два поля введення: перше для радіуса
        циліндра, друге для висоти циліндра.
        Об'єм циліндра виведіть у тіло сторінки.
        */
    </script>
  </body>
</html>
