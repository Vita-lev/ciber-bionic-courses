<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 03</title>
    <style>
      div {
        display: inline-block;
        width: 100px;
        height: 100px;
        background-color: green;
        margin: 10px;
      }
    </style>
  </head>

  <body>
    <div></div>
    <div></div>
    <div></div>

    <script>
      let divs = document.querySelectorAll("div");
      document.addEventListener("keydown", function (event) {
        if (event.key === "1") {
          divs[0].style.border = "2px solid red";
        }
        if (event.key === "2") {
          divs[1].style.border = "2px solid red";
        }
        if (event.key === "3") {
          divs[2].style.border = "2px solid red";
        }

        if (event.ctrlKey && event.key.toLowerCase() === "a") {
          for (const div of divs) {
            div.style.border = "2px solid red";
          }
        }
      });
      /*
        Завдання:
        Реалізуйте сценарій, який під час натискання на клавіші 1, 2 або 3
        на клавіатурі додаватиме рамку
        червоного кольору на відповідний div. Якщо затиснуто клавіші
         Ctrl + A, то червона рамка додається відразу
        для всіх div.
        */
    </script>
  </body>
</html>
