<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 02</title>
    <style>
      .form-group {
        margin: 4px;
      }

      .form-group label {
        width: 75px;
        display: inline-block;
      }
    </style>
  </head>

  <body>
    <form>
      <div class="form-group">
        <label>Логін</label>
        <input type="text" name="login" minlength="4" required />
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input
          type="password"
          name="password"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#\$%\^&\*]).{6,}"
          required
        />
      </div>

      <div class="form-group">
        <input type="submit" value="Зареєструватися" />
      </div>
    </form>

    <div id="message"></div>

    <script>
      let form = document.forms[0];
      let message = document.querySelector("#message");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        message.textContent = "Форма успішно відправлена";
      });
      /*
        Завдання:
        Додайте валідацію форми:
        Поле введення логіну є обов'язковим. Воно має містити не менш
         як 4 символи.
        Поле введення пароля має містити рядкове значення, 
        яке складається не менш як з 6 символів-букв у нижньому та 
        верхньому
        регістрі, цифри та спеціального символу.

        Перевірку варто організувати за допомогою вбудованої валідації.
        Регулярний вираз перевірки пароля -
         (?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#\$%\^&\*] ). {6,}.
        */
    </script>
  </body>
</html>
