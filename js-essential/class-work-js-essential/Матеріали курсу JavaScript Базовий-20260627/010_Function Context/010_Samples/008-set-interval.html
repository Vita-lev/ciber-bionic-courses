<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>setInterval</title>
    <style>
      #box {
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <script>
      let box = document.querySelector("#box");
      let colors = ["red", "green"];
      function changeColor() {
        i++;
        if (i > colors.length - 1) {
          i = 0;
        }
        box.style.backgroundColor = colors[i];
      }

      // setInterval планує регулярний запуск функції із зазначеним інтервалом.
      // Перший параметр – функція, яка запускається.
      // Другий параметр – затримка в мілісекундах (1000 мілісекунд = 1 секунда).
      setInterval(showMessage, 2000); // Функція showMessage буде запускатися з інтервалом у 2 секунди, доки не буде закрито вкладку.
    </script>
  </body>
</html>
