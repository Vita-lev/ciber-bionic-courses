<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Tests</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        background: #0f172a;
        color: #e2e8f0;
      }

      h1 {
        margin-bottom: 8px;
      }

      #summary {
        margin-bottom: 20px;
        font-weight: 600;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        padding: 10px 12px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: #1e293b;
      }

      .ok {
        color: #4ade80;
      }

      .fail {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <h1>JS Tests</h1>
    <p>Відкрий консоль браузера (F12 → Console), щоб побачити результат тестів.</p>

    <script src="script.js"></script>
    <script src="tests.js"></script>
  </body>
</html>
