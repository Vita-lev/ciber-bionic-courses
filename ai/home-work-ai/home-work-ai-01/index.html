<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Моя кнопка.GPT</title>

    <style>
      body {
        margin: 0;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #f4f4f4;

        font-family: Arial, sans-serif;
      }

      button {
        padding: 15px 30px;

        border: none;
        border-radius: 10px;

        background-color: #7c3aed;
        color: white;

        font-size: 18px;

        cursor: pointer;

        transition: 0.3s;
      }

      button:hover {
        background-color: #5b21b6;
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <button onclick="alert('Привіт! Це моя перша AI-сторінка!')">
      Натисни мене. GPT
    </button>
  </body>
</html>
